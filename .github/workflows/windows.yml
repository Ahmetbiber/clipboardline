name: Windows application
# This validation-only branch intentionally does not change main's CI. Dispatch
# this existing workflow ID with this branch ref only AFTER build66 is public.
on:
  workflow_dispatch:
    inputs:
      published_source:
        description: 'Exact 40-character source SHA authenticated by the published 1.7.3/build66 feed'
        required: true
        type: string
      published_release_id:
        description: 'Reviewed numeric ID of the coordinated canonical Latest release'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: clipboardline-production-65-to-66-${{ github.ref }}
  cancel-in-progress: false
jobs:
  production-update:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install pinned observation tools (no application build)
        run: npm ci --no-fund
      - name: Check immutable publication/runtime validation gates
        run: node --test tests/production-update-profile.test.cjs tests/production-metadata.test.cjs
      - name: Verify actual observer retains success and failure native exit codes
        run: node tests/upgrade-observer-selftest.cjs
        env:
          CLIPBOARDLINE_VALIDATION: validation/production-update
      - name: Unchanged published build65 to build66 through real production Settings buttons
        run: node tests/production-update-acceptance.cjs
        env:
          CLIPBOARDLINE_METADATA_TOKEN: ${{ github.token }}
          CLIPBOARDLINE_PUBLISHED_SOURCE: ${{ inputs.published_source }}
          CLIPBOARDLINE_PUBLISHED_RELEASE_ID: ${{ inputs.published_release_id }}
          CLIPBOARDLINE_VALIDATION: validation/production-update
      - name: Upload synthetic-only production update receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clipboardline-production-65-to-66-${{ github.sha }}
          path: windows/validation/production-update/**
          if-no-files-found: warn
          retention-days: 14
