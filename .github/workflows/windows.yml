name: Windows application
# One-off diagnostic branch only. Never merge this dispatch-only workflow into
# main and never use its receipts as exact-source publication evidence.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  quick-upgrade-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/windows-updater-77-diagnostics'
    runs-on: windows-2025
    timeout-minutes: 18
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install pinned observation tools without building product
        run: npm ci --no-fund
      - name: Reproduce immutable77 updater phase with frozen failure diagnostics
        run: node tests/quick-upgrade-artifact.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain metadata-only diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clipboardline-quick-upgrade-77-${{ github.sha }}
          path: windows/validation/quick-upgrade/**
          if-no-files-found: warn
          retention-days: 14
